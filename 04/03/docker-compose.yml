services:
  api:
    build: ./app
    container_name: api
    expose:
      - "5000"
    environment:
      EC2_HOSTNAME: ip-172-31-34-74

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
