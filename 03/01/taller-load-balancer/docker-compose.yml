services:
  api1:
    build: ./api
    environment:
      INSTANCE: api-1
    networks:
      - balance_net

  api2:
    build: ./api
    environment:
      INSTANCE: api-2
    networks:
      - balance_net

  api3:
    build: ./api
    environment:
      INSTANCE: api-3
    networks:
      - balance_net

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - balance_net

networks:
  balance_net:
    driver: bridge
